<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Mailflare — Offline</title>
		<style>
			:root {
				color-scheme: light;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #eef3fb;
				color: #171717;
				font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
			}
			main {
				max-width: 22rem;
				padding: 2rem;
				text-align: center;
			}
			h1 {
				margin: 0 0 0.5rem;
				font-size: 1.125rem;
				font-weight: 600;
			}
			p {
				margin: 0.25rem 0;
				font-size: 0.875rem;
				line-height: 1.5;
				color: #525252;
			}
			button {
				margin-top: 1.25rem;
				border: 0;
				border-radius: 0.75rem;
				background: #2563eb;
				color: #fff;
				font-size: 0.875rem;
				font-weight: 500;
				padding: 0.625rem 1.25rem;
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>You are offline</h1>
			<p>Mailflare needs a connection to load your mailbox.</p>
			<p>Sin conexión. Mailflare necesita conexión para cargar tu buzón.</p>
			<button type="button" onclick="location.reload()">Retry · Reintentar</button>
		</main>
	</body>
</html>
